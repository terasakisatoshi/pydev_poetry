[tool.poetry]
name = "pydev_poetry"
packages = [
    { include = "pydev_poetry", from = "src" },
]
version = "0.1.0"
description = "mysample"
authors = ["Satoshi Terasaki <terasakisatoshi.math@gmail.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
pillow = ">=13.0.0,<14.0.0"
numpy = "^1.22.0"
matplotlib = "^3.3.3"
opencv-python = "^4.5.1"

[tool.poetry.dev-dependencies]
notebook = ">=6.5.7,<7"
nbconvert = ">=7.17.2,<8"
mistune = ">=3.3.3,<4"
black = "^26.3.1"
isort = "^5.7.0"
autoflake = "^1.4"
mock = "^4.0.3"
mypy = "^1.8"
jupyter = "^1.0.0"
jupyterlab = ">=4.6.4,<5"
jupytext = "^1.19.6"
ipywidgets = "^8.1.9"
jupyter-contrib-nbextensions = "^0.5.1"
jupyter_nbextensions_configurator = "^0.4.1"
jupyterlab-code-formatter = "^3.1"
pytest = "^6.2.2"
autopep8 = "^1.5.6"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
