name: Python CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
      PYTHONPATH: src
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pipx install poetry==2.2.1
      - name: Validate and install locked dependencies
        run: |
          poetry check --lock
          poetry env use python
          poetry install --no-root --no-interaction
          poetry run python -m pip check
      - name: Test, format, and type checks
        run: |
          poetry run pytest -q
          poetry run black --check src tests
          poetry run mypy src
      - name: Plotting and OpenCV smoke test
        run: |
          poetry run python - <<'PY'
          from io import BytesIO
          import cv2
          import matplotlib.pyplot as plt
          import numpy as np
          from PIL import Image
          data = np.zeros((16, 16, 3), dtype=np.uint8)
          assert cv2.resize(data, (8, 8)).shape == (8, 8, 3)
          out = BytesIO()
          plt.plot([0, 1], [0, 1])
          plt.savefig(out, format="png")
          plt.close()
          out.seek(0)
          with Image.open(out) as image:
              image.load()
              assert image.width > 0
          PY
